# Fly.io app config for blurpadurp. See docs/deploy.md for the full
# provisioning recipe (Postgres + pgvector, secrets, scheduled machines
# for the pipeline). Adjust `app` and `primary_region` to your Fly org.

app = "blurpadurp"
primary_region = "ams"

[build]

# Runs once per deploy after the image builds, before any app machine
# rolls. If it exits non-zero the deploy aborts — so code can't ship
# referencing columns a migration hasn't applied yet. Has access to
# all Fly secrets (DATABASE_URL etc).
[deploy]
  release_command = "bun run migrate"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  # Canonical reader-facing origin. Drives generated links (magic
  # links, feed/sitemap/issue URLs) and the static-export base URL.
  # The Cloudflare Worker fronts this domain and proxies dynamic paths
  # back to the Fly app at its .fly.dev hostname (the Worker's ORIGIN),
  # so end users never hit *.fly.dev directly. Cut this over only once
  # blurpadurp.com is live through Cloudflare.
  BLURPADURP_PUBLIC_URL = "https://blurpadurp.com"
  ADMIN_EMAIL = "dritory@gmail.com"

# Single HTTP service handling port 80 + 443 with auto-TLS. Fly's
# modern pattern — don't mix with [[services]], that triggers the
# "conflicting service definitions on port 443" error.
[http_service]
  internal_port = 3000
  force_https = true
  # "suspend" (not "stop") snapshots the machine and resumes from RAM,
  # which cuts the cold-start window — and the listen-race that goes
  # with it (see runbook #13). We deliberately stay scale-to-zero
  # (min = 0) so Fly compute tracks Neon's idle: a single autostopping
  # machine can still occasionally race its own stop ("machine still
  # active, refusing to start"), but suspend + tight health checks
  # keep the recovery short rather than eliminating the window.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  # /health is a process-alive probe — it does NOT touch the DB.
  # That's load-bearing for fitting inside Neon's free tier: the
  # database can scale-to-zero between actual pipeline runs and real
  # user traffic. The DB-backed freshness payload lives at /status
  # for external monitors. Don't add DB calls to this path.
  #
  # interval is 15s (not 60s): on a cold start the first post-boot
  # check often fails on the listen race, and a 60s interval meant
  # ports 80/443 stayed degraded for a full minute waiting on the
  # re-check. Frequent probes are cheap precisely because /health is
  # DB-less — keep it that way.
  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/health"
    protocol = "http"
    timeout = "5s"

# Observed peak RSS across both the http_service `app` machine and the
# hourly `scheduler` machine has stayed under ~300 MB — ingest, score,
# and compose are network-bound on the LLM/embedding calls, not
# memory-bound. 512 MB leaves a comfortable headroom while halving the
# default per-machine cost. If a future stage starts approaching the
# cap, bump this rather than chasing OOMs. The `scheduler` machine is
# sized separately in .github/workflows/fly-deploy.yml — keep the two
# in sync.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
