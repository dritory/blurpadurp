# Deploys the app + ensures the single hourly scheduler machine.
#
# The pipeline is:
# 1. `flyctl deploy` rolls the http_service `app` machine with the
#    new image. Migrations run via the `release_command` hook in
#    fly.toml before the new image takes traffic.
# 2. We ensure exactly one Fly machine named `scheduler` exists with
#    the same image and `--schedule hourly`. It runs `bun run cli
#    scheduler-tick` once per hour, which consults pipeline_schedule
#    for which stages are due.
#
# Schedule and per-stage cadence live in the DB (table
# pipeline_schedule, mig 039) and are edited from /admin/scheduler.
# This workflow's only job re. scheduling is keeping the *machine*
# alive and on the latest image.

name: Fly Deploy
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy app + scheduler machine
    runs-on: ubuntu-latest
    concurrency: deploy-group
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: blurpadurp
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy app machine
        run: flyctl deploy --remote-only -a "$FLY_APP"

      - name: Ensure scheduler machine
        run: |
          set -euo pipefail
          IMG=$(flyctl machines list -a "$FLY_APP" --json \
                | jq -r '[.[] | select(.config.metadata["fly_process_group"]=="app")][0].config.image')
          if [ -z "$IMG" ] || [ "$IMG" = "null" ]; then
            echo "Could not read app image; skipping scheduler-machine update."
            exit 0
          fi
          echo "Target image: $IMG"

          ID=$(flyctl machines list -a "$FLY_APP" --json \
               | jq -r '.[] | select(.name=="scheduler") | .id' | head -n1)
          if [ -z "$ID" ]; then
            echo "Creating scheduler machine"
            flyctl machine run "$IMG" \
              --schedule hourly \
              --name scheduler \
              -a "$FLY_APP" \
              -- bun run src/cli.ts scheduler-tick
          else
            echo "Updating scheduler machine ($ID) → $IMG"
            flyctl machine update "$ID" --image "$IMG" --yes -a "$FLY_APP"
          fi
