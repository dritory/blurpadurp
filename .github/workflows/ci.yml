name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bunx biome lint
      - name: Type check
        run: bunx tsc --noEmit
      - name: Unit tests
        run: bun test src

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Match docker-compose: pgvector image, since migrations CREATE
        # EXTENSION vector.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: blurpadurp
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: blurpadurp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blurpadurp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://blurpadurp:dev@localhost:5432/blurpadurp_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run migrations
        run: bun run migrate
      - name: Integration tests
        run: bun run test:integration
